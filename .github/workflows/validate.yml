name: "Validate"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    name: "HACS"
    runs-on: "ubuntu-latest"
    steps:
      - name: "HACS validation"
        uses: "hacs/action@22.5.0"
        with:
          category: "integration"

  validate-hassfest:
    name: "Hassfest"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Hassfest validation"
        uses: "home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93" # master, der Tag 1.0.0 ist ein defekter Altstand
